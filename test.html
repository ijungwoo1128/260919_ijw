<h1>부산지역 교육 및 학교(어린이 시설 등) 관련 입찰공고 찾기 — 단위 테스트 (UT)</h1>
<p id="sum">검사 중…</p>
<p class="note">지금까지 <b>R-01</b>의 UT-01a~h 8개, <b>R-02</b>의 UT-02 1개, <b>R-06(검색 대상 기관 5종)</b>의 UT-06a~f 6개, <b>교육청 자료(금액·개찰일 없는 공고)</b>의 UT-08a~b 2개를 넣었습니다. 수집 규칙 UT-07(10개)은 <code>node tools/test_collect_pen.js</code>로 돌립니다. UT-03·04·05(15개)는 해당 요구사항을 구현할 때 추가합니다. 미실행은 통과가 아닙니다.</p>

<script>
var T = [];
function t(id, name, fn) { var ok = false, msg = ''; try { ok = fn() === true; } catch (e) { msg = e.message; } T.push([id, name, ok, msg]); }
var same = function (a, b) { return JSON.stringify(a) === JSON.stringify(b); };
var rows = window.BUSAN_BIDS.rows;
var PLAY = 'EDC 2단계 2공구 어린이공원 놀이시설 제작설치';
var HOME = '부산도시공사 직장어린이집 건립사업 기본 및 실시설계용역';
var TEACH = '2025년 아르피나 청소년 수련활동 진행 강사 수급 용역';
var titles = function (list) { return list.map(function (r) { return r.title; }); };

t('UT-01a', '「어린이」 → 2건(놀이시설·어린이집 설계)', function () {
  var r = filterBids(rows, { keywords: ['어린이'] });
  return r.length === 2 && same(titles(r).sort(), [HOME, PLAY].sort());
});
t('UT-01b', '「교육」은 동의어로 확장 → 3건, 확장 없이는 0건', function () {
  var ex = expandKeywords(['교육']);
  var r = filterBids(rows, { keywords: ex });
  return same(ex, ['교육', '강사', '연수', '수련', '어린이', '놀이', '어린이집', '유치원', '학교']) &&
    r.length === 3 && same(titles(r).sort(), [HOME, PLAY, TEACH].sort()) &&
    filterBids(rows, { keywords: ['교육'] }).length === 0;
});
t('UT-01c', '금액 범위(경계 포함): 최소 2억→1건 · 1억~3.5억→2건 · 최대 345,454,545→2건 · 최대 345,454,544→1건(어린이집)', function () {
  var a = filterBids(rows, { keywords: ['어린이'], min: 200000000 });
  var b = filterBids(rows, { keywords: ['어린이'], min: 100000000, max: 350000000 });
  var c = filterBids(rows, { keywords: ['어린이'], max: 345454545 });
  var d = filterBids(rows, { keywords: ['어린이'], max: 345454544 });
  return a.length === 1 && a[0].title === PLAY && b.length === 2 && c.length === 2 && d.length === 1 && d[0].title === HOME;
});
t('UT-01d', '남은 일수: 22 · −13 · 0 → 「D-22」 「개찰 지남(13일 전)」 「D-day」', function () {
  return daysUntil('2025-12-02', '2025-11-10') === 22 && daysUntil('2025-10-28', '2025-11-10') === -13 &&
    daysUntil('2025-11-10', '2025-11-10') === 0 &&
    formatRemaining(22) === 'D-22' && formatRemaining(0) === 'D-day' && formatRemaining(-13) === '개찰 지남(13일 전)';
});
t('UT-01e', '정렬: 개찰 전 먼저·남은 일수 적은 순, 지난 것은 가까운 순', function () {
  var s1 = sortBids(filterBids(rows, { keywords: ['어린이'] }), '2025-11-10');
  var s2 = sortBids(filterBids(rows, { keywords: expandKeywords(['교육']) }), '2025-12-23');
  return same(s1.map(function (i) { return [i.row.title, i.days]; }), [[PLAY, 22], [HOME, -13]]) &&
    same(s2.map(function (i) { return [i.row.title, i.days]; }), [[PLAY, -21], [HOME, -56], [TEACH, -292]]);
});
t('UT-01f', '금액 표시: 「345,454,545원」 · 원본 표기 오류는 「(원본 표기 확인 필요)」', function () {
  return formatPrice({ price: 345454545, priceNote: '' }) === '345,454,545원' &&
    formatPrice({ price: 296710000000, priceNote: '과학 표기' }) === '296,710,000,000원 (원본 표기 확인 필요)';
});
t('UT-01g', '지난 공고 제외(기본): 기준일 11-10→1건 · 12-23→0건 · 개찰 당일(12-02)은 남김 · 안내 문구(「마감·개찰 지난 공고 포함」)', function () {
  var q = function (base) { return filterBids(rows, { keywords: ['어린이'], excludeClosed: true, baseDate: base }); };
  var e1 = emptyResultText(true), e0 = emptyResultText(false);
  var base = '이 자료는 도시공사·시청·구(군)·교육청·교육지원청·대학·공공기관의 공개 게시판에서 모은 것뿐입니다. 키워드를 줄이거나 금액 범위를 넓혀 보세요. 「교육」을 입력하면 강사·연수·수련·어린이·놀이·어린이집·유치원·학교로 함께 찾습니다.';
  var hint = '「마감·개찰 지난 공고 포함」을 켜면 지난 공고도 볼 수 있습니다.';
  return q('2025-11-10').length === 1 && q('2025-11-10')[0].title === PLAY && q('2025-12-23').length === 0 &&
    q('2025-12-02').length === 1 &&
    e1.title === '조건에 맞는 공고가 이 자료에 없습니다.' && e0.body === base && e1.body === base + ' ' + hint;
});

t('UT-01h', '오늘 날짜 문자열: 2026-09-19 · 한 자리 월·일은 0을 채움(2026-01-05) · 인자 없이 부르면 오늘', function () {
  var now = new Date(), d = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  return todayText(new Date(2026, 8, 19)) === '2026-09-19' && todayText(new Date(2026, 0, 5)) === '2026-01-05' &&
    todayText(new Date(2025, 11, 31)) === '2025-12-31' &&
    todayText() === now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) &&
    !isNaN(toUtc(todayText()));
});
t('UT-02','빈 조건(키워드 없음 + 금액이 비었거나 기본값 5,000,000 그대로) → EMPTY와 안내 문구, 하나라도 바꿨으면 통과', function () {
  var msg = '키워드나 금액 범위 중 하나 이상을 입력해 주세요. 예: 키워드에 어린이';
  var want = { ok: false, code: 'EMPTY', message: msg };
  var v = function (k, mn, mx) { return validateConditions({ keywords: k, min: mn, max: mx, baseDate: '2025-12-23' }); };
  return same(v('', '', ''), want) && same(v('   ', ' ', ''), want) && same(v(' , ', '', ' '), want) &&
    same(v('', '5,000,000', ''), want) && same(v('', '5000000', ''), want) &&
    v('어린이', '', '').ok === true && v('어린이', '5,000,000', '').ok === true &&
    v('', '6,000,000', '').ok === true && v('', '100,000,000', '').ok === true &&
    v('', '', '400,000,000').ok === true && v('', '5,000,000', '100,000,000').ok === true;
});

t('UT-06a', '검색 대상 기관 필터(실제 자료): 「어린이」 + [1]·[1,2] → 2건, [2]·[2,3,4,5]·[] → 0건, 기관 조건 없음 → 2건', function () {
  var q = function (g) { return filterBids(rows, { keywords: ['어린이'], groups: g }).length; };
  return q([1]) === 2 && q([1, 2]) === 2 && q([2]) === 0 && q([2, 3, 4, 5]) === 0 && q([]) === 0 && q(undefined) === 2 &&
    same(DEFAULT_GROUPS, [1, 2]);
});
t('UT-06b', '기관별 공고 수: 실제 자료 {1:134,2:0,3:0,4:0,5:0} · 분류 없는 공고는 5번(기타)으로 셈', function () {
  return same(countByGroup(rows), { 1: 134, 2: 0, 3: 0, 4: 0, 5: 0 }) &&
    same(countByGroup([{ cat: 2 }, { cat: 3 }, { cat: 3 }, { cat: 4 }, {}]), { 1: 0, 2: 1, 3: 2, 4: 1, 5: 1 });
});
t('UT-06c', '기관을 하나도 안 고르면 NO_GROUP과 안내 문구, 하나라도 고르면 통과', function () {
  var want = { ok: false, code: 'NO_GROUP', message: '검색 대상 기관을 하나 이상 선택해 주세요.' };
  return same(validateGroups([]), want) && same(validateGroups(undefined), want) &&
    validateGroups([1]).ok === true && validateGroups([5]).ok === true && validateGroups([1, 2]).ok === true;
});
t('UT-06d', '기존 수집 자료 분류 → 기관 번호: 교육청 계열 2 · 대학(국립·사립·전문대학) 3 · 그 밖·분류 없음 5', function () {
  return pilotGroup('부산광역시교육청 계열', '초등학교') === 2 && pilotGroup('부산광역시교육청 계열', '교육지원청') === 2 &&
    pilotGroup('대학 계열', '국립대학교') === 3 && pilotGroup('대학 계열', '사립대학교') === 3 &&
    pilotGroup('대학 계열', '전문대학') === 3 && pilotGroup('', '') === 5 && pilotGroup(undefined, undefined) === 5;
});
t('UT-06e', '공개 자료(data.js) 134건은 모두 부산도시공사·아르피나 = 1번(부산광역시 지방공기업)', function () {
  var orgs = {}; rows.forEach(function (r) { orgs[r.org] = 1; });
  return rows.length === 134 && rows.every(function (r) { return r.cat === 1 && r.org; }) &&
    same(Object.keys(orgs).sort(), ['부산도시공사', '부산도시공사 아르피나']);
});
t('UT-06f', '기관 필터 논리(가짜 자료 6건: 1~5번과 분류 없음): [2,4]→2건 · [3]→1건 · [5]→2건(5번+분류 없음) · [1,2,3,4,5]→6건 · 다른 조건과 함께', function () {
  var fake = [
    { title: '가 어린이', price: 9000000, open: '2026-01-01', cat: 1 }, { title: '나 어린이', price: 9000000, open: '2026-01-01', cat: 2 },
    { title: '다 어린이', price: 9000000, open: '2026-01-01', cat: 3 }, { title: '라 어린이', price: 9000000, open: '2026-01-01', cat: 4 },
    { title: '마 어린이', price: 9000000, open: '2026-01-01', cat: 5 }, { title: '바 어린이', price: 9000000, open: '2026-01-01' }
  ];
  var q = function (g, more) { return filterBids(fake, Object.assign({ keywords: ['어린이'], groups: g }, more || {})).map(function (r) { return r.title[0]; }).join(''); };
  return q([2, 4]) === '나라' && q([3]) === '다' && q([5]) === '마바' && q([1, 2, 3, 4, 5]) === '가나다라마바' && q([1]) === '가' &&
    q([1, 2], { min: 10000000 }) === '' && q([1, 2], { excludeClosed: true, baseDate: '2026-02-01' }) === '';
});

t('UT-08a', '금액 미기재(price=null) 공고: 표시는 「금액 미기재」, 금액 조건(최소·최대)으로 빼지 않음, 금액 있는 공고는 그대로 걸러짐', function () {
  var fake = [
    { title: '가 수학여행', price: null, open: '2026-10-01', cat: 2 }, { title: '나 수학여행', price: 1000000, open: '2026-10-01', cat: 2 },
    { title: '다 수학여행', price: 9000000, open: '2026-10-01', cat: 2 }
  ];
  var q = function (c) { return filterBids(fake, Object.assign({ keywords: ['수학여행'] }, c)).map(function (r) { return r.title[0]; }).join(''); };
  return formatPrice(fake[0]) === '금액 미기재' && formatPrice(fake[2]) === '9,000,000원' &&
    q({ min: 5000000 }) === '가다' && q({ min: 5000000, max: 8000000 }) === '가' && q({ max: 2000000 }) === '가나' && q({}) === '가나다';
});
t('UT-08b', '개찰일을 모르는(open=null) 공고: 남은 일수 표시 「개찰일 확인 필요」 · 지난 공고 제외를 켜도 남김 · 목록 맨 뒤로', function () {
  var fake = [
    { title: '가', price: 9000000, open: null, cat: 2 }, { title: '나', price: 9000000, open: '2026-09-25', cat: 2 },
    { title: '다', price: 9000000, open: '2026-09-10', cat: 2 }, { title: '라', price: 9000000, open: '2026-09-20', cat: 2 }
  ];
  var kept = filterBids(fake, { keywords: [], excludeClosed: true, baseDate: '2026-09-19' }).map(function (r) { return r.title; }).join('');
  var order = sortBids(fake, '2026-09-19').map(function (i) { return i.row.title; }).join('');
  return formatRemaining(NaN) === '개찰일 확인 필요' && kept === '가나라' && order === '라나다가';
});

var fx = [
  { title: '가 급식 식재료 구매', price: 9000000, open: '2026-10-01', cat: 2 }, { title: '나 수학여행 위탁 용역', price: 9000000, open: '2026-10-01', cat: 2 },
  { title: '다 교복 구매 입찰', price: 9000000, open: '2026-10-01', cat: 2 }, { title: '라 청소년 캠프 운영', price: 9000000, open: '2026-10-01', cat: 2 },
  { title: '마 어린이 체험 위탁', price: 9000000, open: '2026-10-01', cat: 2 }, { title: '바 시설 공사', price: 9000000, open: '2026-10-01', cat: 2 }
];
var qx = function (kw, ex) { return filterBids(fx, { keywords: kw, exclude: ex }).map(function (r) { return r.title[0]; }).join(''); };
t('UT-13a', '키워드 2개 이상은 하나라도 맞으면 통과(OR): [수학여행,캠프]→나라 · [위탁,구매]→가나다마 · 키워드 없으면 전부', function () {
  return qx(['수학여행', '캠프'], []) === '나라' && qx(['위탁', '구매'], []) === '가나다마' && qx([], []) === '가나다라마바' && qx(['없는말'], []) === '';
});
t('UT-13b', '제외 키워드 1개: 급식 제외 → 가만 빠짐 · 제외 없음(빈 목록·undefined)은 그대로', function () {
  return qx([], ['급식']) === '나다라마바' && qx([], []) === '가나다라마바' && filterBids(fx, { keywords: [] }).length === 6;
});
t('UT-13c', '제외 키워드 2개 이상: [급식,교복]→나라마바 · [급식,교복,공사]→나라마 · 키워드와 함께 [위탁,구매]에서 [교복] 제외→가나마', function () {
  return qx([], ['급식', '교복']) === '나라마바' && qx([], ['급식', '교복', '공사']) === '나라마' && qx(['위탁', '구매'], ['교복']) === '가나마' &&
    qx(['위탁', '구매'], ['급식', '교복', '수학여행']) === '마';
});
t('UT-13d', '검사: 제외 키워드만 넣어도 빈 조건이 아님 · 같은 낱말이 키워드와 제외에 함께 있으면 CONFLICT와 안내 · 겹치지 않으면 통과 · 제외 표시 문구', function () {
  var v = function (k, x) { return validateConditions({ keywords: k, exclude: x, min: '5,000,000', max: '', baseDate: '2026-09-19' }); };
  var c = v('급식, 위탁', '교복, 급식');
  return v('', '급식').ok === true && v('', '급식, 교복').ok === true && v('', '').code === 'EMPTY' && v(' ', ' , ').code === 'EMPTY' &&
    c.ok === false && c.code === 'CONFLICT' && c.message === '키워드와 제외 키워드에 같은 낱말이 있습니다: 급식. 한쪽에서 빼 주세요.' &&
    v('위탁', '급식, 교복').ok === true &&
    summaryLine(3, '2026-09-19', ['급식', '교복']) === '조건에 맞는 공고 3건 (기준일 2026-09-19) · 제외 키워드: 급식, 교복' &&
    summaryLine(3, '2026-09-19', []) === '조건에 맞는 공고 3건 (기준일 2026-09-19)' && summaryLine(3, '2026-09-19') === '조건에 맞는 공고 3건 (기준일 2026-09-19)';
});

t('UT-17', '0건 안내(R-03b): 기본 문구 · 제외 키워드를 썼으면 「제외 키워드를 줄이거나 지워 보세요.」 · 기관을 5개 미만 골랐으면 「검색 대상 기관을 더 골라 보세요(지금 N개 선택).」 · 5개 다 고르면 그 문구 없음 · 지난 공고 안내는 맨 뒤', function () {
  var b0 = emptyResultText(false).body, b1 = emptyResultText(false, { hasExclude: true, groupCount: 2 }).body, b2 = emptyResultText(true, { hasExclude: false, groupCount: 5 }).body;
  var b3 = emptyResultText(true, { hasExclude: true, groupCount: 1 }).body;
  return b0.indexOf('제외 키워드를') === -1 && b0.indexOf('검색 대상 기관을 더') === -1 && b1 === b0 + ' 제외 키워드를 줄이거나 지워 보세요. 검색 대상 기관을 더 골라 보세요(지금 2개 선택).' &&
    b2 === b0 + ' ' + '「마감·개찰 지난 공고 포함」을 켜면 지난 공고도 볼 수 있습니다.' &&
    b3 === b0 + ' 제외 키워드를 줄이거나 지워 보세요. 검색 대상 기관을 더 골라 보세요(지금 1개 선택). 「마감·개찰 지난 공고 포함」을 켜면 지난 공고도 볼 수 있습니다.';
